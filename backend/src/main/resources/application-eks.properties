# Activate together with aws. EksInfrastructureValidation rejects eks alone.
spring.flyway.enabled=false
app.seed.enabled=false
spring.jpa.hibernate.ddl-auto=validate
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
management.server.address=0.0.0.0
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.liveness.additional-path=server:/livez
# Kubernetes readiness excludes MQ: accepted uploads have a durable PostgreSQL outbox.
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.readiness.additional-path=server:/readyz
