spring.application.name=generate-cloud-backend
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/generatecloud}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:generatecloud}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:generatecloud}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.server.port=${MANAGEMENT_PORT:9091}
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.readiness.additional-path=server:/readyz
management.metrics.distribution.percentiles-histogram.semantic_search_duration=true
management.metrics.distribution.percentiles-histogram.storage_request_duration=true

app.jwt.secret=${APP_JWT_SECRET:generate-cloud-demo-secret-key-for-local-development-please-change}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.seed.enabled=${APP_SEED_ENABLED:false}
app.storage.provider=${STORAGE_PROVIDER:minio}
app.storage.root=${STORAGE_ROOT:./data/storage}
app.storage.bucket=${STORAGE_BUCKET:generatecloud-assets}
app.storage.region=${STORAGE_REGION:${AWS_REGION:us-east-1}}
app.storage.endpoint=${STORAGE_ENDPOINT:}
app.storage.access-key=${STORAGE_ACCESS_KEY:}
app.storage.secret-key=${STORAGE_SECRET_KEY:}
app.storage.path-style-access=${STORAGE_PATH_STYLE_ACCESS:true}
app.storage.auto-create-bucket=${STORAGE_AUTO_CREATE_BUCKET:true}
app.storage.prefix=${STORAGE_PREFIX:generate-cloud}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

app.pipeline.enabled=${MEDIA_PIPELINE_ENABLED:false}
app.pipeline.upload-ttl-seconds=${UPLOAD_TTL_SECONDS:900}
app.pipeline.max-bytes=${UPLOAD_MAX_BYTES:15728640}
app.pipeline.max-active-uploads=${UPLOAD_MAX_ACTIVE:20}
app.pipeline.public-storage-endpoint=${STORAGE_PUBLIC_ENDPOINT:}
app.pipeline.model-version=${CLIP_MODEL_VERSION:clip-vit-b32-openai-v1}
app.pipeline.search-enabled=${SEMANTIC_SEARCH_ENABLED:false}
app.pipeline.encoder-url=${ENCODER_URL:http://encoder:8090}
app.pipeline.encoder-token=${ENCODER_TOKEN:local-encoder-token}
app.pipeline.cdn-domain=${CDN_DOMAIN:}
app.pipeline.cdn-key-pair-id=${CDN_KEY_PAIR_ID:}
app.pipeline.cdn-private-key-path=${CDN_PRIVATE_KEY_PATH:}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:generatecloud}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:generatecloud}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Hikari bounds are per API task; budget total connections across API + workers.
spring.datasource.hikari.pool-name=photoplatform-api
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:2000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1500000}
spring.datasource.hikari.keepalive-time=${DB_KEEPALIVE_MS:120000}
spring.datasource.hikari.initialization-fail-timeout=${DB_INITIALIZATION_TIMEOUT_MS:10000}
spring.transaction.default-timeout=${DB_TRANSACTION_TIMEOUT_SECONDS:30}
spring.rabbitmq.connection-timeout=${RABBITMQ_CONNECTION_TIMEOUT:5s}
spring.rabbitmq.requested-heartbeat=${RABBITMQ_HEARTBEAT:30s}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}
spring.rabbitmq.ssl.validate-server-certificate=true
spring.rabbitmq.ssl.verify-hostname=true
app.pipeline.media-url-provider=${MEDIA_URL_PROVIDER:auto}
app.pipeline.media-url-ttl-seconds=${MEDIA_URL_TTL_SECONDS:60}
app.pipeline.cdn-private-key-pem=${CDN_PRIVATE_KEY_PEM:}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.hikaricp.connections.acquire=true
management.metrics.distribution.percentiles-histogram.hikaricp.connections.usage=true
management.metrics.distribution.percentiles-histogram.database_query_duration=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
