# Cloud infrastructure is supplied by environment / ECS Secrets Manager injection.
app.storage.provider=${STORAGE_PROVIDER:aws}
app.storage.bucket=${STORAGE_BUCKET}
app.storage.endpoint=${STORAGE_ENDPOINT:}
app.storage.access-key=${STORAGE_ACCESS_KEY:}
app.storage.secret-key=${STORAGE_SECRET_KEY:}
app.storage.path-style-access=false
app.storage.auto-create-bucket=false
app.storage.prefix=${STORAGE_PREFIX:}
app.pipeline.enabled=true
app.pipeline.public-storage-endpoint=${STORAGE_PUBLIC_ENDPOINT:}
app.pipeline.encoder-token=${ENCODER_TOKEN:}
app.jwt.secret=${APP_JWT_SECRET}
app.seed.enabled=false
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.data-source-properties.sslmode=${DATABASE_SSL_MODE:verify-full}
spring.datasource.hikari.data-source-properties.sslrootcert=${DATABASE_SSL_ROOT_CERT:/app/certs/global-bundle.pem}
spring.datasource.hikari.data-source-properties.connectTimeout=${DATABASE_CONNECT_TIMEOUT_SECONDS:5}
spring.datasource.hikari.data-source-properties.socketTimeout=${DATABASE_SOCKET_TIMEOUT_SECONDS:30}
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true
# Application retries remain at idempotent upload/outbox/job boundaries, never whole arbitrary transactions.
spring.jpa.properties.hibernate.jdbc.timeout=${DATABASE_QUERY_TIMEOUT_SECONDS:20}
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5671}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:true}
