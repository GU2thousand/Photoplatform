name: Verify

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        environment: [dev, prod, eks-dev, eks-prod]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra
      - name: Initialize providers without remote state or AWS credentials
        run: terraform -chdir=infra/environments/${{ matrix.environment }} init -backend=false -input=false
      - name: Validate infrastructure configuration
        run: terraform -chdir=infra/environments/${{ matrix.environment }} validate -no-color
      - name: Initialize root module for credential-free mocked plan tests
        if: matrix.environment == 'dev'
        run: terraform -chdir=infra init -backend=false -input=false
      - name: Verify cloud topology and production configuration safeguards with mocked AWS
        if: matrix.environment == 'dev'
        run: terraform -chdir=infra test -no-color
      - name: Verify deployment safety boundaries
        run: python3 -m unittest discover -s scripts/deploy/tests -v
      - name: Verify private platform bootstrap guards
        if: matrix.environment == 'eks-dev'
        run: python3 -m unittest discover -s deploy/eks-platform/tests -v

  kubernetes-manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Install manifest validation dependencies
        run: python -m pip install jsonschema==4.25.1 -r scripts/kubernetes/requirements.txt
      - name: Verify digest-only manifests, probes, Secrets, networking and production guards
        run: python -m unittest discover -s deploy/helm/tests -v
      - name: Verify hosted Kubernetes migration gate and diagnostic redaction
        run: python -m unittest discover -s scripts/kubernetes/tests -v
      - name: Validate rendered Kubernetes API schemas with pinned kubeconform
        run: |
          python - <<'PY'
          import hashlib, io, os, pathlib, tarfile, urllib.request
          data=urllib.request.urlopen('https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz',timeout=60).read()
          assert hashlib.sha256(data).hexdigest()=='c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3'
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'kubeconform'
          with tarfile.open(fileobj=io.BytesIO(data)) as archive:
              target.write_bytes(archive.extractfile('kubeconform').read())
          target.chmod(0o755)
          PY
          python deploy/helm/tests/render_fixtures.py --output-dir work/helm-render --kubeconform "$RUNNER_TEMP/kubeconform"

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify backend behavior
        working-directory: backend
        run: ./gradlew test --no-daemon

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Build and check types
        working-directory: frontend
        run: npm run build
      - name: Verify connection lifecycle
        working-directory: frontend
        run: npm test
      - name: Check dependency advisories
        working-directory: frontend
        run: npm audit --audit-level=high

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: Install locked worker and test dependencies
        run: python -m pip install -r worker/requirements.txt -r scripts/kubernetes/requirements.txt
      - name: Verify image processing and durable worker failure boundaries
        env:
          PYTHONPATH: worker
        run: python -m unittest discover -s worker/tests -v
      - name: Verify CloudWatch queue collector and scaling signal safety
        run: python -m unittest discover -s ops/cloudwatch/tests -v
      - name: Verify Kubernetes MQ metrics and Ready Pod denominator
        run: python -m unittest discover -s ops/kubernetes/queue-collector/tests -v
      - name: Verify retrieval benchmark metric calculations
        run: python -m unittest discover -s benchmarks/tests -v
      - name: Verify EKS scenario identity, destructive-action and evidence boundaries
        run: python -m unittest discover -s scripts/tests -v

  pipeline-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: photoplatform-ci
      APP_SEED_ENABLED: 'false'
      SEMANTIC_SEARCH_ENABLED: 'false'
      API_PORT: '18082'
      POSTGRES_PORT: '15543'
      MINIO_PORT: '19000'
      RABBITMQ_PORT: '15673'
      POSTGRES_PASSWORD: generatecloud
      MINIO_PASSWORD: minioadmin
      RABBITMQ_PASSWORD: generatecloud
      RABBITMQ_IMAGE: rabbitmq:4.3.6-management-alpine
      TEST_API_URL: http://localhost:18082
      TEST_DATABASE_URL: postgresql://generatecloud:generatecloud@localhost:15543/generatecloud
      ALLOW_INTEGRATION_WRITES: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked integration test dependencies
        run: python -m pip install -r worker/requirements.txt
      - name: Build and start disposable PostgreSQL, MinIO, RabbitMQ, API and worker
        run: docker compose up --build --detach --wait --wait-timeout 240 postgres minio rabbitmq backend worker
      - name: Verify cross-instance WebSocket events against real RabbitMQ
        working-directory: backend
        env:
          RABBITMQ_RELAY_TEST: 'true'
          RABBITMQ_USER: generatecloud
        run: ./gradlew test --tests 'com.generatecloud.app.websocket.TeamEventRelayIntegrationTests' --no-daemon
      - name: Verify concurrent outbox publication leases against real PostgreSQL
        working-directory: backend
        env:
          OUTBOX_POSTGRES_TEST: 'true'
          OUTBOX_JDBC_URL: jdbc:postgresql://localhost:15543/generatecloud
        run: ./gradlew test --tests 'com.generatecloud.app.pipeline.OutboxClaimIntegrationTests' --no-daemon
      - name: Verify direct uploads, permissions, checksums, variants and deletion
        run: |
          mkdir -p artifacts
          python scripts/integration_test.py 2>&1 | tee artifacts/integration.log
      - name: Verify stale leases, retries, cancellation and orphan reconciliation
        run: python scripts/fault_tests.py 2>&1 | tee artifacts/fault-tests.log
      - name: Verify durable publication through a real RabbitMQ outage
        run: python scripts/broker_recovery_test.py --project "$COMPOSE_PROJECT_NAME" 2>&1 | tee artifacts/broker-recovery.log
      - name: Smoke test measured exact and HNSW plans on disposable PostgreSQL
        env:
          ALLOW_VECTOR_BENCHMARK_WRITES: '1'
          BENCHMARK_DATABASE_URL: postgresql://generatecloud:generatecloud@localhost:15543/generatecloud
        run: python benchmarks/pgvector_comparison.py --sizes 100 --queries 8 --dimensions 16 --repeats 2 --output artifacts/vector-smoke.json
      - name: Verify populated legacy schema migration with the same executable JAR
        run: |
          docker compose cp backend:/app/app.jar artifacts/migration-app.jar
          python scripts/migration_test.py --jar artifacts/migration-app.jar --api-port 18083 --log-file artifacts/migration-api.log 2>&1 | tee artifacts/migration-test.log
      - name: Verify renewable worker sessions and V6 attempt cleanup on disposable PostgreSQL
        run: python scripts/worker_contract_test.py 2>&1 | tee artifacts/worker-contracts.log
      - name: Collect service diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          docker compose ps --all > artifacts/compose-ps.log
          docker compose logs --no-color > artifacts/compose.log 2>&1
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-verification-logs
          path: |
            artifacts/*.log
            artifacts/*.json
          retention-days: 7
      - name: Remove disposable services and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
