# The platform bootstrap replaces __NAMESPACE__ with exactly photoplatform-dev
# or photoplatform-prod. Application releases do not create or modify RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: photoplatform-release
  namespace: __NAMESPACE__
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets, serviceaccounts, services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, update, patch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [secrets-store.csi.x-k8s.io]
    resources: [secretproviderclasses]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: photoplatform-release
  namespace: __NAMESPACE__
subjects:
  - kind: Group
    name: photoplatform-deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: photoplatform-release
  apiGroup: rbac.authorization.k8s.io
