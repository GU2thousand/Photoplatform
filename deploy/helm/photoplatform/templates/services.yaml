apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "photo.labels" (dict "root" . "component" "api") | nindent 4 }}
  annotations:
    {{- include "photo.annotations" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "photo.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - {name: http, port: 8080, targetPort: http}
# Management 9091 intentionally has no Service or ingress; discovery scrapes Pods.
{{- if .Values.ml.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-encoder
  labels:
    {{- include "photo.labels" (dict "root" . "component" "encoder") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "photo.selector" (dict "root" . "component" "encoder") | nindent 4 }}
  ports:
    - {name: http, port: 8090, targetPort: http}
{{- end }}
