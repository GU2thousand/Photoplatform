{{- if .Values.telemetry.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata: {name: {{ .Release.Name }}-prometheus}
automountServiceAccountToken: true
---
apiVersion: v1
kind: ConfigMap
metadata: {name: {{ .Release.Name }}-telemetry}
data:
  prometheus.yaml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: {{ .Values.aws.clusterName | quote }}
        namespace: {{ .Release.Namespace | quote }}
    rule_files: [/etc/telemetry/prometheus-rules.yaml]
    scrape_configs:
      - job_name: photoplatform-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces: {names: [{{ .Release.Namespace }}]}
        relabel_configs:
          - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance], action: keep, regex: {{ .Release.Name }}}
          - {source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], action: keep, regex: "true"}
          - {source_labels: [__meta_kubernetes_pod_phase], action: keep, regex: Running}
          # Keep exactly the declared metrics port (pod discovery emits each port).
          - source_labels: [__meta_kubernetes_pod_container_port_name, __meta_kubernetes_pod_label_app_kubernetes_io_component]
            action: keep
            regex: "metrics;.*|http;encoder"
          - {source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path], target_label: __metrics_path__}
          - {source_labels: [__meta_kubernetes_namespace], target_label: namespace}
          - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
          - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component], target_label: component}
          - {source_labels: [__meta_kubernetes_pod_annotation_photoplatform_io_revision], target_label: commit}
          - {source_labels: [__meta_kubernetes_pod_annotation_photoplatform_io_image_digest], target_label: image_digest}
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance, __meta_kubernetes_pod_label_app_kubernetes_io_component]
            separator: "-"
            target_label: deployment
          - target_label: cluster
            replacement: {{ .Values.aws.clusterName | quote }}
  prometheus-rules.yaml: |
    {{- .Files.Get "files/prometheus-rules.yaml" | nindent 4 }}
  otel-collector.yaml: |
    {{- .Files.Get "files/otel-collector.yaml" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dashboard
  labels: {grafana_dashboard: "1"}
data:
  photoplatform-kubernetes.json: |
    {{- .Files.Get "files/dashboard.json" | nindent 4 }}
{{- range $component := list "prometheus" "otel" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $component }}
  labels:
    {{- include "photo.labels" (dict "root" $ "component" $component) | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "photo.selector" (dict "root" $ "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "photo.labels" (dict "root" $ "component" $component) | nindent 8 }}
      annotations:
        {{- include "photo.annotations" $ | nindent 8 }}
        checksum/telemetry: {{ printf "%s%s" ($.Files.Get "files/prometheus-rules.yaml") ($.Files.Get "files/otel-collector.yaml") | sha256sum }}
    spec:
      {{- if eq $component "prometheus" }}
      serviceAccountName: {{ $.Release.Name }}-prometheus
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      securityContext:
        {{- include "photo.security" $ | nindent 8 }}
      {{- if and $.Values.nodeSelector (eq $.Values.runtimeMode "aws") }}
      nodeSelector:
        {{- toYaml $.Values.nodeSelector | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $component }}
          image: {{ include "photo.image" (index $.Values.images $component) | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "photo.containerSecurity" $ | nindent 12 }}
          resources:
            {{- toYaml $.Values.telemetry.resources | nindent 12 }}
          env:
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            {{- if eq $component "otel" }}
            - name: OTEL_EXPORTER_ENDPOINT
              value: {{ $.Values.telemetry.otlpExporterEndpoint | quote }}
            {{- end }}
          {{- if eq $component "prometheus" }}
          args:
            - --config.file=/etc/telemetry/prometheus.yaml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ $.Values.telemetry.prometheusRetention }}
            - --storage.tsdb.retention.size=1GB
          ports: [{name: http, containerPort: 9090}]
          livenessProbe: {httpGet: {path: /-/healthy, port: http}, timeoutSeconds: 5}
          readinessProbe: {httpGet: {path: /-/ready, port: http}, timeoutSeconds: 5}
          volumeMounts:
            - {name: config, mountPath: /etc/telemetry, readOnly: true}
            - {name: data, mountPath: /prometheus}
            - {name: tmp, mountPath: /tmp}
          {{- else }}
          args: [--config=/etc/telemetry/otel-collector.yaml]
          ports: [{name: otlp-http, containerPort: 4318}, {name: health, containerPort: 13133}]
          livenessProbe: {httpGet: {path: /, port: health}, timeoutSeconds: 5}
          readinessProbe: {httpGet: {path: /, port: health}, timeoutSeconds: 5}
          volumeMounts:
            - {name: config, mountPath: /etc/telemetry, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          {{- end }}
      volumes:
        - name: config
          configMap: {name: {{ $.Release.Name }}-telemetry}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        {{- if eq $component "prometheus" }}
        - {name: data, emptyDir: {sizeLimit: {{ $.Values.telemetry.prometheusStorageSizeLimit }}}}
        {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata: {name: {{ .Release.Name }}-otel}
spec:
  type: ClusterIP
  selector:
    {{- include "photo.selector" (dict "root" . "component" "otel") | nindent 4 }}
  ports: [{name: otlp-http, port: 4318, targetPort: otlp-http}]
{{- end }}
