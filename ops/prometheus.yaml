global:
  scrape_interval: 10s
scrape_configs:
  - job_name: api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [backend:9091]
  - job_name: media-worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9100
        refresh_interval: 10s
  - job_name: embedding-worker
    dns_sd_configs:
      - names: [embedding-worker]
        type: A
        port: 9100
        refresh_interval: 10s
